# /home/tuan/.config/tmuxinator/config.yml

name: config
root: ~/.config/nvim

windows:
  - nvim:
      layout: main-vertical
      panes:
        - nvim .
  - i3:
      root: ~/.config/i3
      layout: main-vertical
      panes:
        - nvim config
  - others:
      root: ~/.config
      layout: main-vertical
      panes:
        - zsh
