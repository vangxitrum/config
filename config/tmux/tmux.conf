unbind r
bind r source-file ~/.config/tmux/tmux.conf

set-option -sg escape-time 10
set-option -g focus-events on
set-option -a terminal-features 'XXX:RGB'
set -g prefix C-s
set -g base-index 1
setw -g pane-base-index 1



# Clipboard over SSH: copies reach the terminal I am typing in via OSC 52.
# `clipboard` marks every outer terminal as able to take OSC 52 (tmux only
# sends it when terminfo has Ms). See scripts/clip.sh.
set -s set-clipboard on
set -as terminal-features ',*:clipboard'

# vim keymap
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '~/work/config/scripts/clip.sh --x11'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel '~/work/config/scripts/clip.sh --x11'
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# new windows and splits open in the session root (= first window's root)
bind c new-window -c "#{session_path}"
bind '"' split-window -v -c "#{session_path}"
bind %  split-window -h -c "#{session_path}"

# jump to the window referenced by the most recent x-tmux-target notification
bind-key g run-shell '~/work/config/scripts/tmux-jump-last-notify.sh'

bind-key b run-shell '~/work/config/scripts/tmux-jump-back.sh'

# toggle agent notification mode: both -> tmux -> dunst -> off -> both
bind-key N run-shell '~/work/config/scripts/agent-notify-mode.sh toggle'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Disable tmux-continuum automatic session save (0 = off).
set -g @continuum-save-interval '0'
# Disable tmux-resurrect manual save keybind (prefix + Ctrl-s): 'none' stops
# resurrect from binding the key. Nothing is persisted, manual or automatic.
set -g @resurrect-save 'none'

set -s default-terminal 'tmux-256color'

set-option -g renumber-windows on

run '~/.config/tmux/plugins/tpm/tpm'

# ---- Nord powerline statusline ----
set -g status on
set -g status-position top
set -g status-interval 60
set -g status-justify left
set -g status-style "bg=#2e3440,fg=#d8dee9"
set -g status-left-length 40
set -g status-right-length 120
set -g message-style "bg=#5e81ac,fg=#2e3440,bold"

# left: session
set -g status-left "#[fg=#2e3440,bg=#{?client_prefix,#ebcb8b,#5e81ac},bold]  #S #[fg=#{?client_prefix,#ebcb8b,#5e81ac},bg=#2e3440]"

# right: weather (Ho Chi Minh City) + date + time
set -g status-right "#[fg=#a3be8c,bg=#2e3440]#[fg=#2e3440,bg=#a3be8c,bold] #(~/work/config/scripts/tmux-weather.sh) #[fg=#5e81ac,bg=#a3be8c]#[fg=#d8dee9,bg=#5e81ac] %b %d #[fg=#88c0d0,bg=#5e81ac]#[fg=#2e3440,bg=#88c0d0,bold] %H:%M "

# window tabs
set -g window-status-separator ""
setw -g window-status-format "#[fg=#2e3440,bg=#4c566a]#[fg=#eceff4,bg=#4c566a] #I #W #[fg=#4c566a,bg=#2e3440]"
setw -g window-status-current-format "#[fg=#2e3440,bg=#88c0d0]#[fg=#2e3440,bg=#88c0d0,bold] #I #W #[fg=#88c0d0,bg=#2e3440]"

# live per-window agent indicator (agent-state.sh drives @agent_seg per window).
# Appended AFTER tpm so it survives dotbar's window-status-format; the global
# default keeps idle tabs blank. #{@agent_seg} is resolved in each window's ctx.
set -g @agent_seg ""
set -ga window-status-format         "#{@agent_seg}"
set -ga window-status-current-format "#{@agent_seg}"
# customize the tab text/glyphs (defaults shown):
# set -g @agent_label_working "working"
# set -g @agent_label_input   "needs input"
# set -g @agent_label_max     "32"
# set -g @agent_input_icon    "🔔"
# set -g @agent_frames        "🌑 🌒 🌓 🌔 🌕 🌖 🌗 🌘"
# manually clear a stuck indicator (e.g. after an agent crash): prefix + A
bind-key A run-shell '~/work/config/scripts/agent-state.sh idle'

# pane styling: full border around each pane + dim inactive
set -g pane-border-lines heavy
set -g pane-active-border-style 'fg=#bd93f9'
set -g pane-border-style 'fg=#44475a'
set -g window-active-style 'fg=#f8f8f2,bg=default'
set -g window-style 'fg=#b0b8c8,bg=default'

# Clear any live resurrect save bind left in a running server (reload alone
# won't unbind it). Runs after tpm so it wins.
unbind -T prefix C-s
