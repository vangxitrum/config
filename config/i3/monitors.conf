# Included from config.local, after it sets $monitor_left / $monitor_right.
# (i3 only passes variables down into included files, not back up.)

# screen order: left monitor is primary, the right one sits to its right
exec_always xrandr --output $monitor_left --primary --output $monitor_right --right-of $monitor_left

# assign workspace to monitor
workspace $ws1 output $monitor_left
workspace $ws2 output $monitor_right
workspace $ws3 output $monitor_left
workspace $ws4 output $monitor_right
workspace $ws5 output $monitor_right
workspace $ws7 output $monitor_right
