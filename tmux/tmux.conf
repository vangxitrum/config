unbind r
bind r source-file ~/.config/tmux/tmux.conf

set-option -sg escape-time 10
set-option -g focus-events on
set-option -a terminal-features 'XXX:RGB'
set -g prefix C-s
set -g base-index 1
setw -g pane-base-index 1



# vim keymap
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# jump to the window referenced by the most recent x-tmux-target notification
bind-key g run-shell '~/work/config/scripts/tmux-jump-last-notify.sh'

bind-key b run-shell '~/work/config/scripts/tmux-jump-back.sh'

# toggle agent notification mode: both -> tmux -> dunst -> off -> both
bind-key N run-shell '~/work/config/scripts/agent-notify-mode.sh toggle'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# dracula settings
set -s default-terminal 'tmux-256color'
set -g @dracula-show-powerline true
set -g @dracula-fixed-location "hochiminh"
set -g @dracula-plugins "weather"
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g @dracula-show-fahrenheit false
set -g status-position top

run '~/.config/tmux/plugins/tpm/tpm'

# live per-window agent indicator (agent-state.sh drives @agent_seg per window).
# Appended AFTER tpm so it survives dracula's window-status-format; the global
# default keeps idle tabs blank. #{@agent_seg} is resolved in each window's ctx.
set -g @agent_seg ""
set -ga window-status-format         "#{@agent_seg}"
set -ga window-status-current-format "#{@agent_seg}"
# customize the tab text/glyphs (defaults shown):
# set -g @agent_label_working "working"
# set -g @agent_label_input   "needs input"
# set -g @agent_label_max     "32"
# set -g @agent_input_icon    "🔔"
# set -g @agent_frames        "🌑 🌒 🌓 🌔 🌕 🌖 🌗 🌘"
# manually clear a stuck indicator (e.g. after an agent crash): prefix + A
bind-key A run-shell '~/work/config/scripts/agent-state.sh idle'

# pane styling: full border around each pane + dim inactive
set -g pane-border-lines heavy
set -g pane-active-border-style 'fg=#bd93f9'
set -g pane-border-style 'fg=#44475a'
set -g window-active-style 'fg=#f8f8f2,bg=default'
set -g window-style 'fg=#b0b8c8,bg=default'
